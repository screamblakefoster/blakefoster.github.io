name: Update YouTube Videos

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get YouTube videos
        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET

          url = "https://www.youtube.com/feeds/videos.xml?channel_id=UCxhSx6DOlS6fGkA0cOe8JUw"

          try:
              data = urllib.request.urlopen(url).read()
              root = ET.fromstring(data)

              print("YouTube feed successfully reached.")
              print(f"Found {len(root)} entries.")

          except Exception as e:
              print(f"YouTube feed error: {e}")
              raise
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update YouTube videos"
          git push

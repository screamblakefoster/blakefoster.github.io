name: Update YouTube Videos

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update videos.html
        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import re
          import html

          FEED_URL = "https://www.youtube.com/feeds/videos.xml?channel_id=UCxhSx6DOlS6fGkA0cOe8JUw"
          FILE = "videos.html"

          print("Checking YouTube for new videos...")

          # Get YouTube RSS feed
          request = urllib.request.Request(
              FEED_URL,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              feed_data = response.read()

          root = ET.fromstring(feed_data)

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015"
          }

          videos = []

          for entry in root.findall("atom:entry", ns):
              video_id = entry.findtext("yt:videoId", "", ns)
              title = entry.findtext("atom:title", "", ns)

              if not video_id:
                  continue

              videos.append({
                  "id": video_id,
                  "title": html.escape(title)
              })

          print(f"Found {len(videos)} videos in YouTube feed.")

          # Read current videos.html
          with open(FILE, "r", encoding="utf-8") as f:
              content = f.read()

          # Find all existing YouTube video IDs
          existing_ids = set(
              re.findall(
                  r'youtube\.com/watch\?v=([A-Za-z0-9_-]+)',
                  content
              )
          )

          print(f"Found {len(existing_ids)} existing videos on website.")

          # Find new videos
          new_videos = [
              video for video in videos
              if video["id"] not in existing_ids
          ]

          print(f"Found {len(new_videos)} new videos.")

          if not new_videos:
              print("No new videos. Website already up to date.")
              raise SystemExit(0)

          # Build HTML for new videos
          new_html = ""

          for video in new_videos:
              video_id = video["id"]
              title = video["title"]

              new_html += f'''
              <!-- AUTO-ADDED YOUTUBE VIDEO -->

              <a
                class="video"
                href="https://www.youtube.com/watch?v={video_id}"
                target="_blank"
                rel="noopener noreferrer"
              >

                <div class="thumbnail">

                  <img
                    src="https://i.ytimg.com/vi/{video_id}/hqdefault.jpg"
                    alt="{title}"
                  >

                  <div class="play-button"></div>

                </div>

                <div class="video-title">
                  {title}
                </div>

              </a>

          '''

          # Insert new videos at the beginning of the grid
          marker = '<section class="grid">'

          if marker not in content:
              raise Exception("Could not find video grid in videos.html")

          content = content.replace(
              marker,
              marker + new_html,
              1
          )

          # Write updated file
          with open(FILE, "w", encoding="utf-8") as f:
              f.write(content)

          print("videos.html successfully updated.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automatically update YouTube videos"
            git push
          fi

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blake Foster</title>
<link rel="icon" href="favicon.png" type="image/png">
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --muted: #8c8c8c;
    --line: #2b2b2b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
  }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400;
  }

  a { color: inherit; text-decoration: none; }

  .back {
    position: fixed;
    top: 22px;
    left: 22px;
    z-index: 10;

    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid var(--line);
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);

    transition: border-color 0.2s ease, opacity 0.2s ease;
  }

  .back:hover { border-color: #555555; }

  .back svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .count {
    position: fixed;
    top: 30px;
    right: 22px;
    z-index: 10;

    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.06em;
  }

  .roll {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
  }

  .roll img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #111111;
  }

  @media (min-width: 650px) {
    .roll { grid-template-columns: repeat(6, 1fr); gap: 3px; }
  }

  @media (min-width: 1100px) {
    .roll { grid-template-columns: repeat(8, 1fr); gap: 3px; }
  }
</style>
</head>
<body>

  <a class="back" href="index.html" aria-label="Back to site">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19 12H5M11 6l-6 6 6 6"/>
    </svg>
  </a>

  <div class="count" id="photo-count"></div>

  <div class="roll" id="roll"></div>

  <script>
    // Bump this number after every shoot — photos live in /photos
    // named sequentially and zero-padded to 3 digits: 001.jpg, 002.jpg, etc.
    const totalPhotos = 250;

    const roll = document.getElementById("roll");
    const countLabel = document.getElementById("photo-count");

    const fragment = document.createDocumentFragment();

    for (let i = 1; i <= totalPhotos; i++) {
      const num = String(i).padStart(3, "0");
      const img = document.createElement("img");
      img.src = `photos/${num}.jpg`;
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";
      fragment.appendChild(img);
    }

    roll.appendChild(fragment);
    countLabel.textContent = `${totalPhotos} photos`;
  </script>

</body>
</html>

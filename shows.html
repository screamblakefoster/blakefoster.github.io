<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blake Foster — Shows</title><link rel="icon" href="favicon.png" type="image/png">
<style>
:root{--bg:#000;--fg:#fff;--muted:#777;--line:#2b2b2b}*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:400}a{color:inherit;text-decoration:none}
header{width:100%;display:flex;flex-direction:column;align-items:center;padding:55px 30px 70px}.logo-switch{position:relative;width:190px;padding:0;margin:0 0 27.5px;border:0;background:transparent;cursor:pointer;display:block}.logo-switch .logo{width:100%;height:auto;display:block;margin:0}.logo-white{position:relative;z-index:1}.logo-colored{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .18s ease;pointer-events:none}.logo-switch:hover .logo-colored,.logo-switch.is-colored .logo-colored{opacity:1}
nav{display:flex;justify-content:center;align-items:center;gap:42px;font-size:30px;line-height:1}nav a{color:#fff;text-decoration:none;transition:opacity .2s ease}nav a:hover{opacity:.55}nav a.active{opacity:1;text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:1px}
main{width:100%;padding:0 30px 120px}.shows{width:100%;max-width:1100px;margin:0 auto}.page-label{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}.show-card{display:grid;grid-template-columns:180px 1fr auto;align-items:center;gap:42px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:34px 0}.show-date{text-align:center;line-height:1}.show-month{display:block;font-size:16px;letter-spacing:.08em;margin-bottom:7px}.show-day{display:block;font-size:76px;font-weight:400;letter-spacing:-.06em}.show-info{min-width:0}.show-venue{font-size:30px;line-height:1.05;margin-bottom:10px}.show-location{color:var(--muted);font-size:15px;line-height:1.3}.show-status{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:18px}.show-action{min-width:130px;text-align:center}.ticket-button{display:inline-flex;align-items:center;justify-content:center;min-width:130px;height:46px;padding:0 22px;border:1px solid #fff;border-radius:999px;color:#fff;font-size:13px;letter-spacing:.03em;transition:background .2s ease,color .2s ease}.ticket-button.disabled{border-color:#333;color:#555;cursor:default;pointer-events:none}.show-tabs{display:flex;align-items:center;gap:12px;margin-bottom:28px;font-size:18px}.show-tab{color:#777;transition:color .2s ease}.show-tab:hover,.show-tab.active{color:#fff}.show-tab.active{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}.show-tab-divider{color:#333}
footer{padding:30px;color:#666;font-size:11px}
@media(max-width:900px){header{padding:45px 20px 60px}.logo-switch{width:165px;margin-bottom:22.5px}nav{gap:28px;font-size:25px}main{padding:0 20px 90px}.show-card{grid-template-columns:135px 1fr auto;gap:28px}.show-day{font-size:62px}.show-venue{font-size:26px}}
@media(max-width:650px){header{padding:35px 18px 50px}.logo-switch{width:140px;margin-bottom:19px}nav{gap:18px;flex-wrap:wrap;justify-content:center;font-size:20px}main{padding:0 18px 70px}.show-tabs{gap:10px;margin-bottom:22px;font-size:16px}.show-card{grid-template-columns:82px minmax(0,1fr) auto;gap:18px;padding:28px 0 30px}.show-month{font-size:12px;margin-bottom:7px}.show-day{font-size:48px}.show-venue{font-size:22px;margin-bottom:7px}.show-location{font-size:13px}.show-status{font-size:9px;margin-top:12px;white-space:nowrap}.show-action{min-width:92px;text-align:right}.ticket-button{min-width:92px;height:40px;padding:0 12px;font-size:11px}}
@media(max-width:450px){.logo-switch{width:120px;margin-bottom:15px}nav{font-size:18px;gap:15px}.show-card{grid-template-columns:66px minmax(0,1fr) auto;gap:12px;padding:24px 0 26px}.show-day{font-size:42px}.show-month{font-size:11px}.show-venue{font-size:19px}.show-location{font-size:12px}.show-status{font-size:8px;margin-top:10px}.show-action{min-width:78px}.ticket-button{min-width:78px;height:36px;padding:0 9px;font-size:10px}}
</style></head>
<body>
<header><button class="logo-switch" type="button" aria-label="Toggle logo color" aria-pressed="false"><img class="logo logo-white" src="transparent-white-mask.png" alt="Blake Foster"><img class="logo logo-colored" src="colored-mask-logo.png" alt="" aria-hidden="true"></button><nav aria-label="Main navigation"><a href="index.html">Music</a><a class="active" href="shows.html" aria-current="page">Shows</a><a href="about.html">About</a><a href="videos.html">Videos</a><a href="shop.html">Shop</a></nav></header>
<main><section class="shows"><div class="show-tabs" aria-label="Show history navigation"><a class="show-tab active" href="shows.html">Upcoming</a><span class="show-tab-divider">|</span><a class="show-tab" href="past-shows.html">Past</a></div><article class="show-card"><div class="show-date"><span class="show-month">DEC</span><span class="show-day">18</span></div><div class="show-info"><div class="show-venue">Wonder Bar</div><div class="show-location">Asbury Park, New Jersey</div><div class="show-status">More details coming soon</div></div><div class="show-action"><span class="ticket-button disabled">Tickets Soon</span></div></article></section></main>
<footer>© 2026 Blake Foster</footer>
<script>const logoSwitch=document.querySelector('.logo-switch');if(logoSwitch&&window.matchMedia('(hover:none),(pointer:coarse)').matches){logoSwitch.addEventListener('click',()=>{const isColored=logoSwitch.classList.toggle('is-colored');logoSwitch.setAttribute('aria-pressed',isColored?'true':'false')})}</script>
</body></html>

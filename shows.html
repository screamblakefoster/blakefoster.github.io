<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Blake Foster — Shows</title>
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --muted: #777777;
      --line: #2b2b2b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
    }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 400;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       LOGO + NAVIGATION
       ========================= */

    header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 55px 30px 70px;
    }

    .logo {
      width: 190px;
      height: auto;
      display: block;
      margin-bottom: 27.5px;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 42px;
      font-size: 30px;
      line-height: 1;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 0.55;
    }

    nav a.active {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 7px;
      text-decoration-thickness: 1px;
    }

    /* =========================
       SHOWS
       ========================= */

    main {
      width: 100%;
      padding: 0 30px 120px;
    }

    .shows {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .page-label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .show-card {
      display: grid;
      grid-template-columns: 180px 1fr auto;
      align-items: center;
      gap: 42px;

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);

      padding: 34px 0;
    }

    .show-date {
      text-align: center;
      line-height: 1;
    }

    .show-month {
      display: block;
      font-size: 16px;
      letter-spacing: 0.08em;
      margin-bottom: 7px;
    }

    .show-day {
      display: block;
      font-size: 76px;
      font-weight: 400;
      letter-spacing: -0.06em;
    }

    .show-info {
      min-width: 0;
    }

    .show-venue {
      font-size: 30px;
      line-height: 1.05;
      margin-bottom: 10px;
    }

    .show-location {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.3;
    }

    .show-status {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 18px;
    }

    .show-action {
      min-width: 130px;
      text-align: center;
    }

    .ticket-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 130px;
      height: 46px;
      padding: 0 22px;

      border: 1px solid #ffffff;
      border-radius: 999px;

      color: #ffffff;
      font-size: 13px;
      letter-spacing: 0.03em;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        opacity 0.2s ease;
    }

    .ticket-button:hover {
      background: #ffffff;
      color: #000000;
    }

    .ticket-button.disabled {
      border-color: #333333;
      color: #555555;
      cursor: default;
      pointer-events: none;
    }

    /* =========================
       FOOTER
       ========================= */

    footer {
      padding: 30px;
      color: #666666;
      font-size: 11px;
    }

    /* =========================
       TABLET
       ========================= */

    @media (max-width: 900px) {

      header {
        padding: 45px 20px 60px;
      }

      .logo {
        width: 165px;
        margin-bottom: 22.5px;
      }

      nav {
        gap: 28px;
        font-size: 25px;
      }

      main {
        padding: 0 20px 90px;
      }

      .show-card {
        grid-template-columns: 135px 1fr auto;
        gap: 28px;
      }

      .show-day {
        font-size: 62px;
      }

      .show-venue {
        font-size: 26px;
      }
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 650px) {

      header {
        padding: 35px 18px 50px;
      }

      .logo {
        width: 140px;
        margin-bottom: 19px;
      }

      nav {
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
        font-size: 20px;
      }

      main {
        padding: 0 18px 70px;
      }

      .page-label {
        margin-bottom: 14px;
      }

      .show-card {
        grid-template-columns: 1fr auto;
        gap: 18px 20px;
        padding: 26px 0 30px;
      }

      .show-date {
        grid-column: 1 / -1;
        text-align: left;
        display: flex;
        align-items: baseline;
        gap: 9px;
        margin-bottom: 2px;
      }

      .show-month {
        font-size: 13px;
        margin-bottom: 0;
      }

      .show-day {
        font-size: 54px;
      }

      .show-info {
        align-self: center;
      }

      .show-venue {
        font-size: 24px;
        margin-bottom: 7px;
      }

      .show-location {
        font-size: 14px;
      }

      .show-status {
        font-size: 10px;
        margin-top: 13px;
      }

      .show-action {
        align-self: center;
        text-align: right;
        min-width: 105px;
      }

      .ticket-button {
        min-width: 105px;
        height: 42px;
        padding: 0 16px;
        font-size: 12px;
      }
    }

    /* =========================
       SMALL PHONE
       ========================= */

    @media (max-width: 450px) {

      .logo {
        width: 120px;
        margin-bottom: 15px;
      }

      nav {
        font-size: 18px;
        gap: 15px;
      }

      .show-card {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .show-date {
        grid-column: 1;
      }

      .show-action {
        text-align: left;
        min-width: 0;
      }

      .ticket-button {
        width: 100%;
      }

      .show-day {
        font-size: 50px;
      }

      .show-venue {
        font-size: 22px;
      }
    }

  </style>
</head>

<body>

  <!-- =========================
       LOGO + NAVIGATION
       ========================= -->

  <header>

    <img
      class="logo"
      src="transparent-white-mask.png"
      alt="Blake Foster"
    >

    <nav aria-label="Main navigation">

      <a href="index.html">
        Music
      </a>

      <a
        class="active"
        href="shows.html"
        aria-current="page"
      >
        Shows
      </a>

      <a href="about.html">
        About
      </a>

      <a href="videos.html">
        Videos
      </a>

      <a href="shop.html">
        Shop
      </a>

    </nav>

  </header>

  <!-- =========================
       SHOWS
       ========================= -->

  <main>

    <section class="shows">

      <div class="page-label">
        Live
      </div>

      <article class="show-card">

        <div class="show-date">
          <span class="show-month">DEC</span>
          <span class="show-day">18</span>
        </div>

        <div class="show-info">

          <div class="show-venue">
            Wonder Bar
          </div>

          <div class="show-location">
            Asbury Park, New Jersey
          </div>

          <div class="show-status">
            More details coming soon
          </div>

        </div>

        <div class="show-action">

          <span class="ticket-button disabled">
            Tickets Soon
          </span>

        </div>

      </article>

    </section>

  </main>

  <footer>
    © 2026 Blake Foster
  </footer>

</body>
</html>

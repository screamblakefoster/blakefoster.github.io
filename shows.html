<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Blake Foster — Shows</title>

  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --muted: #8c8c8c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
    }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 400;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       LOGO + NAVIGATION
       ========================= */

    header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 55px 30px 75px;
    }

    .logo {
      width: 190px;
      height: auto;
      display: block;
      margin-bottom: 27.5px;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 42px;
      font-size: 30px;
      line-height: 1;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 0.55;
    }

    nav a.active {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 7px;
      text-decoration-thickness: 1px;
    }

    /* =========================
       SHOWS
       ========================= */

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 30px 100px;
    }

    .shows {
      width: 100%;
    }

    .show {
      display: grid;
      grid-template-columns: 180px 1fr auto;
      align-items: center;
      gap: 40px;

      padding: 30px 0;

      border-bottom: 1px solid #222222;
    }

    .show:first-child {
      border-top: 1px solid #222222;
    }

    .date {
      font-size: 24px;
      line-height: 1.1;
    }

    .venue {
      font-size: 24px;
      line-height: 1.1;
    }

    .location {
      color: var(--muted);
      font-size: 16px;
      margin-top: 8px;
    }

    .show-link {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .show-link:hover {
      opacity: 0.55;
    }

    /* =========================
       FOOTER
       ========================= */

    footer {
      padding: 30px;
      color: #666666;
      font-size: 11px;
    }

    /* =========================
       TABLET
       ========================= */

    @media (max-width: 900px) {

      header {
        padding: 45px 20px 60px;
      }

      .logo {
        width: 165px;
        margin-bottom: 22.5px;
      }

      nav {
        gap: 28px;
        font-size: 25px;
      }

      main {
        padding: 0 20px 80px;
      }

      .show {
        grid-template-columns: 150px 1fr auto;
        gap: 25px;
      }

      .date,
      .venue {
        font-size: 21px;
      }
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 650px) {

      header {
        padding: 35px 18px 50px;
      }

      .logo {
        width: 140px;
        margin-bottom: 19px;
      }

      nav {
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
        font-size: 20px;
      }

      main {
        padding: 0 18px 70px;
      }

      .show {
        grid-template-columns: 1fr auto;
        gap: 15px;
        padding: 25px 0;
      }

      .date {
        grid-column: 1 / -1;
        font-size: 22px;
      }

      .venue {
        font-size: 20px;
      }

      .location {
        font-size: 14px;
      }

      .show-link {
        font-size: 12px;
      }
    }

    /* =========================
       SMALL PHONE
       ========================= */

    @media (max-width: 450px) {

      .logo {
        width: 120px;
        margin-bottom: 15px;
      }

      nav {
        font-size: 18px;
        gap: 15px;
      }

      .date {
        font-size: 20px;
      }

      .venue {
        font-size: 18px;
      }

      .location {
        font-size: 13px;
      }

      .show-link {
        font-size: 11px;
      }
    }

  </style>
</head>

<body>


  <!-- =========================
       LOGO + NAVIGATION
       ========================= -->

  <header>

    <img
      class="logo"
      src="transparent-white-mask.png"
      alt="Blake Foster"
    >

    <nav aria-label="Main navigation">

      <a href="index.html">
        Music
      </a>

      <a
        class="active"
        href="shows.html"
        aria-current="page"
      >
        Shows
      </a>

      <a href="about.html">
        About
      </a>

      <a href="videos.html">
        Videos
      </a>

      <a href="shop.html">
        Shop
      </a>

    </nav>

  </header>


  <!-- =========================
       SHOWS
       ========================= -->

  <main>

    <section class="shows">

      <div class="show">

        <div class="date">
          DEC 18, 2026
        </div>

        <div>
          <div class="venue">
            Wonder Bar
          </div>

          <div class="location">
            Asbury Park, NJ
          </div>
        </div>

        <div class="show-link">
          Details Soon
        </div>

      </div>

    </section>

  </main>


  <footer>
    © 2026 Blake Foster
  </footer>


</body>
</html>

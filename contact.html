<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Blake Foster — Contact</title>

  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
    }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 400;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       LOGO + NAVIGATION
       ========================= */

    header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 55px 30px 75px;
    }

    .logo {
      width: 190px;
      height: auto;
      display: block;
      margin-bottom: 27.5px;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 42px;
      font-size: 30px;
      line-height: 1;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 0.55;
    }

    nav a.active {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 7px;
      text-decoration-thickness: 1px;
    }

    /* =========================
       CONTACT
       ========================= */

    main {
      min-height: 45vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 0 30px 100px;

      text-align: center;
    }

    .contact-message {
      display: inline-block;
      max-width: 900px;
      padding: 28px 38px;
      background: #ffffff;
      color: #000000;
      border-radius: 18px;
      font-size: 30px;
      line-height: 1.2;
    }

    .contact-message a {
      color: #000000;
      text-decoration: underline;
      text-underline-offset: 5px;
      text-decoration-thickness: 1px;
    }

    .contact-message a:hover {
      opacity: 0.55;
    }

    /* =========================
       FOOTER
       ========================= */

    footer {
      padding: 30px;
      color: #666666;
      font-size: 11px;
    }

    /* =========================
       TABLET
       ========================= */

    @media (max-width: 900px) {

      header {
        padding: 45px 20px 60px;
      }

      .logo {
        width: 165px;
        margin-bottom: 22.5px;
      }

      nav {
        gap: 28px;
        font-size: 25px;
      }

      main {
        padding: 0 20px 80px;
      }

      .contact-message {
        padding: 24px 30px;
        font-size: 25px;
        border-radius: 16px;
      }
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 650px) {

      header {
        padding: 35px 18px 50px;
      }

      .logo {
        width: 140px;
        margin-bottom: 19px;
      }

      nav {
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
        font-size: 20px;
      }

      main {
        padding: 0 18px 70px;
      }

      .contact-message {
        padding: 20px 24px;
        font-size: 20px;
        border-radius: 14px;
      }
    }

    /* =========================
       SMALL PHONE
       ========================= */

    @media (max-width: 450px) {

      .logo {
        width: 120px;
        margin-bottom: 15px;
      }

      nav {
        font-size: 18px;
        gap: 15px;
      }

      .contact-message {
        padding: 18px 20px;
        font-size: 18px;
        border-radius: 12px;
      }
    }

  </style>
</head>

<body>

  <!-- =========================
       LOGO + NAVIGATION
       ========================= -->

  <header>

    <img
      class="logo"
      src="transparent-white-mask.png"
      alt="Blake Foster"
    >

    <nav aria-label="Main navigation">

      <a href="index.html">
        Music
      </a>

      <a href="shows.html">
        Shows
      </a>

      <a href="about.html">
        About
      </a>

      <a
        class="active"
        href="contact.html"
        aria-current="page"
      >
        Contact
      </a>

      <a href="shop.html">
        Shop
      </a>

    </nav>

  </header>


  <!-- =========================
       CONTACT
       ========================= -->

  <main>

    <div class="contact-message">
      Please direct all inquiries to
      <a href="mailto:screamblakefoster@gmail.com">
        screamblakefoster@gmail.com
      </a>
    </div>

  </main>


  <footer>
    © 2026 Blake Foster
  </footer>


</body>
</html>
